<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wide Dashboard</title>

<!-- YAML parser -->
https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js

<!-- Microsoft Auth -->
https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js

<style>

/* ---------- GLOBAL ---------- */
html, body {
  margin: 0;
  height: 400px;          /* fixed height */
  overflow: hidden;       /* no scroll */
  font-family: Arial;
  background: #f5f6fa;
}

/* ---------- DASHBOARD GRID ---------- */
.dashboard {
  display: grid;
  grid-template-columns: 1.3fr 1.3fr 1fr;
  gap: 15px;
  padding: 10px;
  height: 100%;
  box-sizing: border-box;
}

/* ---------- COLUMN STYLE ---------- */
.column {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: white;
  padding: 10px;
  border-radius: 10px;
  overflow: hidden;
}

/* Titles */
h2 {
  font-size: 16px;
  margin: 4px 0;
}

/* ---------- SPOTIFY ---------- */
.spotify-wrapper {
  position: relative;
  width: 100%;
  padding-top: 80px; /* compact player */
}
.spotify-wrapper iframe {
  position: absolute;
  width: 100%;
  height: 100%;
}

/* ---------- POMODORO ---------- */
.pomodoro-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.timer-display {
  font-size: 28px;
}
button {
  padding: 5px 8px;
  cursor: pointer;
}

/* ---------- AGENDA ---------- */
.agenda-list {
  overflow-y: auto;
  max-height: 160px;
  font-size: 12px;
}
.next-meeting {
  background: #2ecc71;
  color: white;
  padding: 8px;
  border-radius: 6px;
  font-size: 12px;
}

/* ---------- TODO ---------- */
.todo-input {
  display: flex;
  gap: 5px;
}
.todo-input input {
  flex: 1;
}
.todo-list {
  overflow-y: auto;
  max-height: 160px;
  font-size: 12px;
  list-style: none;
  padding: 0;
}
.todo-list li {
  display: flex;
  justify-content: space-between;
  padding: 6px;
}
.done {
  text-decoration: line-through;
  opacity: 0.6;
}

</style>
</head>
<body>

<div class="dashboard">

  <!-- COLUMN 1: Spotify + Pomodoro -->
  <div class="column">
    
    <div>
      <h2>🎧 Music</h2>
      <div class="spotify-wrapper">
        <iframe id="spotifyPlayer"></iframe>
      </div>
    </div>

    <div>
      <h2>🍅 Timer</h2>
      <div class="pomodoro-row">
        <div class="timer-display" id="timer">25:00</div>
        <div>
          <button onclick="startTimer()">▶</button>
          <button onclick="pauseTimer()">⏸</button>
          <button onclick="resetTimer()">⏹</button>
        </div>
      </div>
    </div>

  </div>

  <!-- COLUMN 2: Agenda -->
  <div class="column">

    <div>
      <h2>⏭ Next</h2>
      <div id="nextMeeting" class="next-meeting">Loading...</div>
    </div>

    <div>
      <h2>📅 Agenda</h2>
      <div id="agendaList" class="agenda-list"></div>
    </div>

  </div>

  <!-- COLUMN 3: TODO -->
  <div class="column">

    <div>
      <h2>✅ To‑Do</h2>
      <div class="todo-input">
        <input id="newTodo" placeholder="Add task">
        <button onclick="addTodo()">+</button>
      </div>
    </div>

    <ul id="todoList" class="todo-list"></ul>

  </div>

</div>

<script>

/* ---------- LOAD YAML ---------- */
async function loadYAML() {
  const res = await fetch('data.yaml');
  const text = await res.text();
  const data = jsyaml.load(text);

  renderDashboard(data);
}

/* ---------- RENDER DASHBOARD ---------- */
function renderDashboard(data) {

  /* Spotify */
  document.getElementById('spotifyPlayer').src =
    `https://open.spotify.com/embed/${data.spotify.type}/${data.spotify.id}`;

  /* Pomodoro */
  if (data.pomodoro) initPomodoro(data.pomodoro);

  /* Todo */
  if (data.todo) initTodo(data.todo);

  /* Calendar */
  if (data.calendar?.enableAgenda) fetchAgenda();
}

/* ---------- POMODORO ---------- */
let timer, timeLeft, config;

function initPomodoro(cfg) {
  config = cfg;
  timeLeft = cfg.work * 60;
  updateDisplay();
}

function updateDisplay() {
  let m = Math.floor(timeLeft/60);
  let s = timeLeft%60;
  document.getElementById('timer').textContent =
    `${m}:${String(s).padStart(2,'0')}`;
}

function startTimer() {
  if (timer) return;
  timer = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) resetTimer();
    updateDisplay();
  }, 1000);
}

function pauseTimer() {
  clearInterval(timer);
  timer = null;
}

function resetTimer() {
  pauseTimer();
  timeLeft = config.work * 60;
  updateDisplay();
}

/* ---------- TODO ---------- */
let todos = [];

function initTodo(yamlTodos) {
  todos = yamlTodos;
  renderTodos();
}

function renderTodos() {
  const list = document.getElementById('todoList');
  list.innerHTML = '';

  todos.forEach((t,i)=>{
    const li = document.createElement('li');
    if (t.done) li.classList.add('done');

    li.innerHTML = `
      <span onclick="toggleTodo(${i})">${t.text}</span>
      <button onclick="deleteTodo(${i})">X</button>
    `;
    list.appendChild(li);
  });
}

function addTodo() {
  const input = document.getElementById('newTodo');
  if (!input.value) return;

  todos.push({text:input.value, done:false});
  input.value='';
  renderTodos();
}

function toggleTodo(i){
  todos[i].done = !todos[i].done;
  renderTodos();
}

function deleteTodo(i){
  todos.splice(i,1);
  renderTodos();
}

/* ---------- MICROSOFT LOGIN ---------- */
const msalInstance = new msal.PublicClientApplication({
  auth: {
    clientId: "YOUR_CLIENT_ID", // replace
    redirectUri: window.location.origin
  }
});

async function login() {
  const res = await msalInstance.loginPopup({
    scopes:["Calendars.Read"]
  });
  return res.accessToken;
}

/* ---------- FETCH AGENDA ---------- */
async function fetchAgenda() {
  const token = await login();

  const start = new Date();
  start.setHours(0,0,0,0);

  const end = new Date();
  end.setHours(23,59,59,999);

  const url =
    `https://graph.microsoft.com/v1.0/me/calendarview` +
    `?startDateTime=${start.toISOString()}` +
    `&endDateTime=${end.toISOString()}`;

  const res = await fetch(url, {
    headers:{ Authorization:`Bearer ${token}` }
  });

  const data = await res.json();
  renderAgenda(data.value);
}

/* ---------- RENDER AGENDA ---------- */
function renderAgenda(events) {

  const agenda = document.getElementById("agendaList");
  const nextBox = document.getElementById("nextMeeting");

  agenda.innerHTML = "";
  let now = new Date();
  let next = null;

  events
    .sort((a,b)=>new Date(a.start.dateTime)-new Date(b.start.dateTime))
    .forEach(e => {

      const start = new Date(e.start.dateTime);
      const end = new Date(e.end.dateTime);

      agenda.innerHTML += `
        <div>
          <strong>${e.subject}</strong><br>
          ${start.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
        </div>
      `;

      if (!next && start > now) next = e;
    });

  if (next){
    const s = new Date(next.start.dateTime);
    nextBox.innerHTML =
      `${next.subject}<br>${s.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
  } else {
    nextBox.innerHTML = "Free 🎉";
  }
}

/* ---------- INIT ---------- */
loadYAML();

</script>
</body>
</html>
